name: Protect Main Branch

on:
  push:
    branches: [main]

jobs:
  check-merge:
    name: Verify PR Merge
    runs-on: ubuntu-latest
    
    steps:
      - name: Check if push is from PR merge
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "Commit message: $COMMIT_MESSAGE"
          
          # Check if this is a merge commit or squash merge from PR
          if [[ "$COMMIT_MESSAGE" == Merge* ]] || [[ "$COMMIT_MESSAGE" == *"(#"*")"* ]]; then
            echo "This is a PR merge commit. Allowed."
            exit 0
          fi
          
          # Allow bot commits
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]] || [[ "${{ github.actor }}" == "github-actions[bot]" ]]; then
            echo "This is a bot commit. Allowed."
            exit 0
          fi
          
          echo "ERROR: Direct push to main detected!"
          echo "Pusher: ${{ github.actor }}"
          echo "Please use Pull Requests to merge changes to main."
          exit 1
