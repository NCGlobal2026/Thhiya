version: 2

updates:
  # Frontend dependencies - ALL grouped into ONE PR
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "development"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      all-frontend-deps:
        patterns:
          - "*"

  # Backend dependencies - ALL grouped into ONE PR
  - package-ecosystem: "npm"
    directory: "/backend"
    target-branch: "development"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      all-backend-deps:
        patterns:
          - "*"

  # GitHub Actions - ALL grouped into ONE PR
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns:
          - "*"

